# Weekly dependency updates. Minor/patch bumps are grouped into one PR per
# ecosystem to keep review load low; majors arrive individually because they
# need a human to read the changelog.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  # Actions are pinned by commit SHA; Dependabot bumps the SHA and the
  # trailing `# vX.Y.Z` comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  # Base images are pinned by tag + digest (Dockerfile ARGs, compose files).
  - package-ecosystem: docker
    directories:
      - /
      - /db
    schedule:
      interval: weekly
      day: monday
    groups:
      docker-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
    ignore:
      # Majors are deliberate: Postgres must match the RDS engine version,
      # Redis the ElastiCache engine, and LocalStack 4.14.0 is the last tag
      # that runs without an auth token.
      - dependency-name: postgres
        update-types: [version-update:semver-major]
      - dependency-name: redis
        update-types: [version-update:semver-major]
      - dependency-name: localstack/localstack
        update-types: [version-update:semver-major, version-update:semver-minor]
    groups:
      compose-minor-patch:
        update-types: [minor, patch]
