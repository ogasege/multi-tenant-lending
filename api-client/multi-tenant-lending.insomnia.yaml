      - url: "{{ _.base_url }}/v1/auth/login"
        name: "Flood the login: 429"
        meta:
          id: req_d47b6e1524b0924cbe30f2624ecdb41d
          created: 1794009600000
          modified: 1794009600000
          sortKey: 7
          description: "Credential routes allow 20 attempts per minute per client. The pre-request script first sends 20 failed logins for an account that does not exist, so this request is over the limit (to repeat by hand instead, send it 21 times within a minute). Locally the API trusts one proxy hop, so the burst uses a random documentation address (198.51.100.0/24) in `X-Forwarded-For`: it spends that address’s budget, not yours. Behind the AWS load balancer the real client address is used instead."
          isPrivate: false
        method: POST
        body:
          mimeType: application/json
          text: |-
            {
              "institutionSlug": "{{ _.lender_slug }}",
              "email": "nobody@example.invalid",
              "password": "not-a-real-password-1A"
            }
        headers:
          - name: Content-Type
            value: application/json
          - name: X-Forwarded-For
            value: "{{ _.rate_limit_client_ip }}"
        authentication:
          type: none
        scripts:
          preRequest: |-
            insomnia.environment.set('rate_limit_client_ip', `198.51.100.${1 + Math.floor(Math.random() * 254)}`);
            // Spend this client's login budget: 20 failed logins before the request.
            const sendOne = () =>
              new Promise((resolve) =>
                insomnia.sendRequest(
                  {
                    url: `${insomnia.variables.get('base_url')}/v1/auth/login`,
                    method: 'POST',
                    header: [
                      { key: 'Content-Type', value: 'application/json' },
                      { key: 'X-Forwarded-For', value: insomnia.variables.get('rate_limit_client_ip') },
                    ],
                    body: { mode: 'raw', raw: JSON.stringify({ institutionSlug: insomnia.variables.get('lender_slug'), email: 'nobody@example.invalid', password: 'not-a-real-password-1A' }) },
                  },
                  () => resolve(),
                ),
              );
            for (let i = 0; i < 20; i += 1) await sendOne();
          afterResponse: |-
            let body = {};
            try {
              body = insomnia.response.json() ?? {};
            } catch (e) {
              // no JSON body
            }
            insomnia.test("status is 429", () => {
              insomnia.expect(insomnia.response.code).to.eql(429);
            });
            insomnia.test("code is \"RATE_LIMITED\"", () => {
              insomnia.expect(body.code).to.eql("RATE_LIMITED");
            });
            insomnia.test("Retry-After is set", () => {
              insomnia.expect(insomnia.response.headers.get('Retry-After')).to.exist;
            });
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: global
          cookies:
            send: false
            store: false
          rebuildPath: true
      - url: "{{ _.base_url }}/v1/webhook-endpoints"
