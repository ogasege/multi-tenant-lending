  - name: 1 Platform
    meta:
      id: fld_d294fcce0cc88587843099d85dd805ae
      created: 1794009600000
      modified: 1794009600000
      sortKey: 1
      description: The platform operator registers lenders. Each run registers a new lender with a random slug, homed in this cell; folder 8 uses it to show that one lender cannot see another.
    children:
      - url: "{{ _.base_url }}/v1/platform/auth/login"
        name: Log in as platform admin
        meta:
          id: req_8815dabea01fc7b9e50486b3cb41082d
          created: 1794009600000
          modified: 1794009600000
          sortKey: 0
          description: Platform administrators use their own login route and token audience.
          isPrivate: false
        method: POST
        body:
          mimeType: application/json
          text: |-
            {
              "email": "{{ _.platform_admin_email }}",
              "password": "{{ _.platform_admin_password }}"
            }
        headers:
          - name: Content-Type
            value: application/json
        authentication:
          type: none
        scripts:
          afterResponse: |-
            let body = {};
            try {
              body = insomnia.response.json() ?? {};
            } catch (e) {
              // no JSON body
            }
            insomnia.test("status is 200", () => {
              insomnia.expect(insomnia.response.code).to.eql(200);
            });
            insomnia.test("tokenType is \"Bearer\"", () => {
              insomnia.expect(body.tokenType).to.eql("Bearer");
            });
            try {
              insomnia.environment.set('platform_token', body.accessToken);
            } catch (e) {
              // not in this response
            }
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: global
          cookies:
            send: false
            store: false
          rebuildPath: true
      - url: "{{ _.base_url }}/v1/platform/institutions"
        name: Register a lender
        meta:
          id: req_c2afbc789fa235b427f84944178dfe09
          created: 1794009600000
          modified: 1794009600000
          sortKey: 1
          description: Creates the tenant, its branding, its chart of accounts and its first admin in one transaction. `homeRegion` must be this cell (another region answers 422 WRONG_CELL). The first admin password is generated per run and kept in `new_lender_admin_password`.
          isPrivate: false
        method: POST
        body:
          mimeType: application/json
          text: |-
            {
              "slug": "{{ _.new_lender_slug }}",
              "legalName": "Demo Lender {{ _.new_lender_slug }} Ltd",
              "countryCode": "{{ _.country_code }}",
              "defaultCurrency": "{{ _.currency }}",
              "supportedCurrencies": [
                "{{ _.currency }}"
              ],
              "lenderType": "MICROFINANCE_BANK",
              "homeRegion": "{{ _.cell_region }}",
              "timezone": "{{ _.timezone }}",
              "branding": {
                "displayName": "Demo Lender {{ _.new_lender_slug }}",
                "primaryColor": "#0B5FFF",
                "secondaryColor": "#111827",
                "locale": "{{ _.locale }}"
              },
              "firstAdmin": {
                "fullName": "Demo Admin",
                "email": "admin@{{ _.new_lender_slug }}.example",
                "password": "{{ _.new_lender_admin_password }}"
              }
            }
        headers:
          - name: Content-Type
            value: application/json
        authentication:
          type: bearer
          token: "{{ _.platform_token }}"
          prefix: ""
          disabled: false
        scripts:
          preRequest: |-
            const $uuid = () =>
              'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, (c) => {
                const r = Math.floor(Math.random() * 16);
                return (c === 'x' ? r : (r % 4) + 8).toString(16);
              });
            const suffix = Math.random().toString(36).slice(2, 8).padEnd(6, '0');
            insomnia.environment.set('new_lender_slug', `demo-lender-${suffix}`);
            insomnia.environment.set('new_lender_admin_password', `Demo-${$uuid().slice(0, 8)}-Pass1`);
          afterResponse: |-
            let body = {};
            try {
              body = insomnia.response.json() ?? {};
            } catch (e) {
              // no JSON body
            }
            insomnia.test("status is 201", () => {
              insomnia.expect(insomnia.response.code).to.eql(201);
            });
            insomnia.test("slug equals new_lender_slug", () => {
              insomnia.expect(body.slug).to.eql(insomnia.variables.get('new_lender_slug'));
            });
            insomnia.test("homeRegion equals cell_region", () => {
              insomnia.expect(body.homeRegion).to.eql(insomnia.variables.get('cell_region'));
            });
            insomnia.test("status is \"ACTIVE\"", () => {
              insomnia.expect(body.status).to.eql("ACTIVE");
            });
            insomnia.test("firstAdmin.password is not exposed", () => {
              insomnia.expect(body.firstAdmin.password).to.not.exist;
            });
            insomnia.test("firstAdmin.passwordHash is not exposed", () => {
              insomnia.expect(body.firstAdmin.passwordHash).to.not.exist;
            });
            try {
              insomnia.environment.set('new_lender_id', body.id);
            } catch (e) {
              // not in this response
            }
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: global
          cookies:
            send: false
            store: false
          rebuildPath: true
      - url: "{{ _.base_url }}/v1/platform/institutions?limit=20"
        name: List lenders
        meta:
          id: req_eafdf32f49c3870f523519d8d6a871f6
          created: 1794009600000
          modified: 1794009600000
          sortKey: 2
          description: Cursor-paginated; `limit` is capped at 100.
          isPrivate: false
        method: GET
        headers: []
        authentication:
          type: bearer
          token: "{{ _.platform_token }}"
          prefix: ""
          disabled: false
        scripts:
          afterResponse: |-
            let body = {};
