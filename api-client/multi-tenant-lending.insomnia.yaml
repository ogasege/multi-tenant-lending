      - url: "{{ _.base_url }}/v1/loan-applications"
        name: Apply at checkout
        meta:
          id: req_6cfcef5dd7797427d36e3650ee15a67a
          created: 1794009600000
          modified: 1794009600000
          sortKey: 3
          description: "Finances the cart: the supplier is paid directly at disbursement. A fresh `Idempotency-Key` and checkout order reference are generated per run."
          isPrivate: false
        method: POST
        body:
          mimeType: application/json
          text: |-
            {
              "productId": "{{ _.product_id }}",
              "principal": "{{ _.cart_principal }}",
              "term": 30,
              "externalOrderReference": "{{ _.order_reference }}"
            }
        headers:
          - name: Content-Type
            value: application/json
          - name: Idempotency-Key
            value: "{{ _.application_key }}"
        authentication:
          type: bearer
          token: "{{ _.customer_token }}"
          prefix: ""
          disabled: false
        scripts:
          preRequest: |-
            const $uuid = () =>
