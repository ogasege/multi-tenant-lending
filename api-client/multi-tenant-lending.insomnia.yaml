  - name: 3 Pharmacy
    meta:
      id: fld_20b04a4f018b89f369ce009213afc636
      created: 1794009600000
      modified: 1794009600000
      sortKey: 3
      description: "A pharmacy signs up with a demo applicant (known APPROVE decision) and finances its cart at checkout. Each national id signs up once per lender: on a second run the sign-up answers 409 and the login that follows still works."
    children:
      - url: "{{ _.base_url }}/v1/institutions/{{ _.lender_slug }}/customers/register"
        name: Sign up (demo applicant)
        meta:
          id: req_58a8340ebd0219a918f5c77864629e31
          created: 1794009600000
          modified: 1794009600000
          sortKey: 0
          description: Self-registration for this lender. The national id is stored only as a keyed HMAC plus its last 4 digits, and never returned. 409 means this applicant already signed up (the next request logs in instead). At most 30 sign-ups per lender per hour.
          isPrivate: false
        method: POST
        body:
          mimeType: application/json
          text: |-
            {
              "customerType": "BUSINESS",
              "businessName": "{{ _.applicant_business_name }}",
              "businessRegistrationNumber": "{{ _.applicant_registration_number }}",
              "operatingLicenceNumber": "{{ _.applicant_licence_number }}",
              "firstName": "{{ _.applicant_first_name }}",
              "lastName": "{{ _.applicant_last_name }}",
              "email": "{{ _.applicant_email }}",
              "phone": "{{ _.applicant_phone }}",
              "dateOfBirth": "1984-06-15",
              "nationalId": "{{ _.applicant_national_id }}",
              "employmentStatus": "BUSINESS_OWNER",
              "monthsInEmployment": 60,
              "currency": "{{ _.currency }}",
              "monthlyIncome": "{{ _.applicant_monthly_income }}",
              "monthlyExpenses": "{{ _.applicant_monthly_expenses }}",
              "existingMonthlyDebt": "0",
              "password": "{{ _.applicant_password }}"
            }
        headers:
          - name: Content-Type
            value: application/json
        authentication:
          type: none
        scripts:
          afterResponse: |-
            let body = {};
            try {
              body = insomnia.response.json() ?? {};
            } catch (e) {
              // no JSON body
            }
            insomnia.test("status is one of 201, 409", () => {
              insomnia.expect(insomnia.response.code).to.be.oneOf([201,409]);
            });
            insomnia.test("national id is not returned", () => {
              insomnia.expect(JSON.stringify(body).includes(String(insomnia.variables.get('applicant_national_id')))).to.eql(false);
            });
            try {
              if (insomnia.response.code === 201) insomnia.environment.set('customer_token', body.tokens.accessToken);
            } catch (e) {
              // not in this response
            }
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: global
          cookies:
            send: false
            store: false
          rebuildPath: true
