            insomnia.test("status is 200", () => {
              insomnia.expect(insomnia.response.code).to.eql(200);
            });
            insomnia.test("items is a list of at most 20", () => {
              insomnia.expect(Array.isArray(body.items) && body.items.length <= 20).to.eql(true);
            });
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: global
          cookies:
            send: false
            store: false
          rebuildPath: true
